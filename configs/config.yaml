# Med-Nexus Master Configuration File
project_name: "Med-Nexus"
version: "1.0.0"
target_journal: "Medical Image Analysis"

# Device Configuration
device: "auto" # "cuda", "cpu", or "auto"

# Model Hyperparameters
vision_model:
  backbone: "densenet121"
  input_channels: 3
  image_size: 224
  embedding_dim: 256

text_model:
  embedding_dim: 256
  vocab_size: 10000
  max_seq_length: 512

fusion_model:
  hidden_dim: 512
  num_classes: 2 # 0: Normal / Unremarkable, 1: Abnormal / Respiratory Condition
  class_labels:
    0: "Normal / Unremarkable"
    1: "Abnormal Respiratory Finding"

# GIB Diagnostic Framework Thresholds (Project 2)
gib_framework:
  conflict_threshold: 0.45      # Cosine similarity below this flags cross-modal conflict
  distractor_top_k: 5           # Default retrieval top-k
  temperature_scaling: 1.25     # Probability calibration temperature

# CRPA Contribution-Aware Attention (Project 4)
crpa_attention:
  num_heads: 4
  attention_dim: 256
  sensitivity_threshold: 0.015  # Edge contribution threshold below which edges are gated/suppressed
  max_longitudinal_steps: 16    # Max temporal monitoring steps (e.g. Day 1..14)

# Experiments Configuration
experiments:
  random_seed: 42
  retrieval_noise_k_list: [0, 1, 3, 5, 10]
  visual_ambiguity_levels: ["clean", "gaussian_blur", "motion_blur", "crop_degrade"]
  attention_efficiency_methods: ["dense", "sliding_window", "naive_suppression", "contribution_gated"]
  output_dir: "results"
